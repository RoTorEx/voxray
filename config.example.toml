# One switch for every profile. Drive paths mirror the existing calls_dir values.
sync_gogle_drive = false

[default]
inbox_dir = "/Users/you/Calls Inbox"
calls_dir = "/Users/you/Calls"
date_format = "%Y-%m-%d %H-%M"
mode = "folder"
keep_video = false
modules = ["communication"]

[profiles.dummy]
inbox_dir = "/path/to/inbox"
calls_dir = "/path/to/calls"
date_format = "%Y-%m-%d %H-%M"
mode = "folder"
keep_video = false
modules = []

[transcription]
model = "whisperkit:openai_whisper-large-v3"

[analysis]
model = "gpt-5.6-terra"
reasoning_effort = "medium"
api_url = "https://api.openai.com/v1/responses"

# Credentials stay private and separate from routing.
[google_drive]
# credentials_file = "/absolute/private/google-drive-oauth.json"
