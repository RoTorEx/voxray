[default]
inbox_dir = "/Users/you/Calls Inbox"
calls_dir = "/Users/you/Calls"
date_format = "%Y-%m-%d %H-%M"
mode = "folder"
keep_video = false
modules = ["communication"]

[profiles.dummy]
inbox_dir = "/path/to/inbox"
calls_dir = "/path/to/calls"
date_format = "%Y-%m-%d %H-%M"
mode = "folder"
keep_video = false
modules = []

[transcription]
model = "whisperkit:openai_whisper-large-v3"

[analysis]
model = "gpt-5.6-terra"
reasoning_effort = "medium"
api_url = "https://api.openai.com/v1/responses"

# Optional personal Google Drive archive. No credentials are needed while disabled.
[default.drive]
enabled = false
# folder_id = "YOUR_FOLDER_ID"

[profiles.dummy.drive]
enabled = false
# folder_id = "YOUR_PROJECT_FOLDER_ID"

[google_drive]
# credentials_file = "/absolute/private/google-drive-oauth.json"
