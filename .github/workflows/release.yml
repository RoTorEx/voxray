name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: build-aarch64
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify release version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Build release assets
        env:
          DIST_DIR: ${{ runner.temp }}/voxray-dist
        run: make release-publish

      - name: Smoke install release asset
        env:
          DIST_DIR: ${{ runner.temp }}/voxray-dist
          INSTALL_DIR: ${{ runner.temp }}/voxray-install
        run: |
          sh scripts/install.sh \
            --archive "$DIST_DIR/voxray-macos-aarch64.tar.gz" \
            --install-dir "$INSTALL_DIR" \
            --no-path-update
          "$INSTALL_DIR/bin/voxray" --version

      - name: Upload release assets
        uses: actions/upload-artifact@v6
        with:
          name: voxray-macos-aarch64
          path: ${{ runner.temp }}/voxray-dist/*
          if-no-files-found: error

  publish:
    name: publish-github-release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: voxray-macos-aarch64
          path: release-assets

      - name: Include installer
        run: cp scripts/install.sh release-assets/voxray-install.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          files=(release-assets/*)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
