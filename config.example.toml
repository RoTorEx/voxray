[default]
inbox_dir = "/Users/you/Calls Inbox"
calls_dir = "/Users/you/Calls"
date_format = "%Y-%m-%d %H-%M"
mode = "folder"
call_type = "general"
subject_name = "Your Name"
subject_role = "participant"
source_language = "auto"
call_goal = ""
subject_speakers = []
modules = ["communication"]

[profiles.sales]
inbox_dir = "/Users/you/Calls Inbox"
calls_dir = "/Users/you/Calls/Sales"
date_format = "%Y-%m-%d %H-%M"
mode = "folder"
call_type = "sales"
subject_name = "Your Name"
subject_role = "seller"
source_language = "auto"
call_goal = "Understand fit and agree on a concrete next step"
subject_speakers = []
modules = ["sales", "english", "communication"]

[transcription]
model = "whisperkit:openai_whisper-large-v3"
timestamps = true
speakers = true

[analysis]
model = "gpt-5.6-terra"
reasoning_effort = "medium"
api_url = "https://api.openai.com/v1/responses"
